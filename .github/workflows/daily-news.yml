name: daily-news

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run news script
        run: python3 scripts/fetch_news.py

      - name: Commit and push
        run: |
          git config user.name "news-bot"
          git config user.email "bot@aaryn-hs.github.io"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "daily news $(date +'%Y-%m-%d')"
          git push
