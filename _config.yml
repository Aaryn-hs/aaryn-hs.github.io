title: "老叶的博客"
description: "记录与思考"
remote_theme: just-the-docs/just-the-docs@v0.10.1
url: "https://aaryn-hs.github.io"

# 搜索
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  rel_url: true
  button: false

# 颜色主题
color_scheme: light

# 导航
aux_links:
  "GitHub":
    - "https://github.com/Aaryn-hs"
aux_links_new_tab: true

# 启用目录
nav_sort: case_sensitive
heading_anchors: true

# 页脚
footer_content: "Copyright &copy; 2026 老叶. Distributed by an <a href=\"https://github.com/Aaryn-hs/aaryn-hs.github.io/tree/main\">open source project.</a>"

# 插件
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# GitHub Metadata (optional, for better repo integration)
repository: Aaryn-hs/aaryn-hs.github.io
